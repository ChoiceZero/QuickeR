name: Build & Publish (Release)

# Manual only. Bumps the third version digit (x.y.Z), builds every platform and
# publishes a GitHub release with an auto-generated changelog of merged PRs.
# A 4th "preview" digit (x.y.z.N, see build-publish-preview.yml) is ignored here.

on:
  workflow_dispatch:

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          # Any 4th (preview) component is read into _PREVIEW and dropped.
          IFS='.' read -r MAJOR MINOR PATCH _PREVIEW <<< "$CURRENT"
          PATCH=$((PATCH+1))
          if [ "$PATCH" -ge 10 ]; then
            PATCH=0
            MINOR=$((MINOR+1))
            if [ "$MINOR" -ge 10 ]; then
              MINOR=0
              MAJOR=$((MAJOR+1))
            fi
          fi
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "Current version: $CURRENT -> New version: $NEW"
          sed -i "s/^version[[:space:]]*=[[:space:]]*\".*\"/version = \"$NEW\"/" pyproject.toml
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Resolve commit sha to build
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: bump-version
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.bump-version.outputs.sha }}

  release:
    name: Publish to Releases
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Generate changelog (PRs merged since last stable release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          SHA: ${{ needs.bump-version.outputs.sha }}
        run: |
          # Previous stable tag only (vX.Y.Z); preview tags (vX.Y.Z.N) are skipped
          # so their PRs are rolled into this release's notes.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -n1 || true)
          echo "Previous stable tag: ${PREV:-<none>}"
          ARGS=(-f "tag_name=v$VERSION" -f "target_commitish=$SHA")
          if [ -n "$PREV" ]; then ARGS+=(-f "previous_tag_name=$PREV"); fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${ARGS[@]}" --jq .body > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.bump-version.outputs.version }}
          target_commitish: ${{ needs.bump-version.outputs.sha }}
          name: QuickeR v${{ needs.bump-version.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/linux-appimage/QuickeR-linux.AppImage
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/windows-installer/QuickeR-windows-setup.exe
            artifacts/android-build/*.apk
            artifacts/macos-build/QuickeR-macos.zip
            artifacts/macos-dmg/QuickeR-macos.dmg
          fail_on_unmatched_files: true
