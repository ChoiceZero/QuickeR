name: Build App (Linux, Android, Windows, macOS) + Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-linux-${{ runner.os }}
      - name: Build
        run: uv run flet build linux --yes --verbose --no-rich-output
      - name: Package
        run: |
          cd build/linux
          zip -r ../../QuickeR-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: QuickeR-linux.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set UTF-8 codepage
        run: chcp 65001
        shell: cmd
      - name: Set app version from pyproject.toml
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version' | Select-Object -First 1
          $version = ($line.Line -replace 'version\s*=\s*"(.*)"', '$1')
          Write-Host "Detected version: $version"
          (Get-Content src/main.py) -replace '__VERSION__', $version | Set-Content src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\flutter
          key: flutter-windows-${{ runner.os }}-v2
      - name: Build
        run: uv run flet build windows --yes --verbose --no-rich-output
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
      - name: Package
        run: Compress-Archive -Path build/windows/* -DestinationPath QuickeR-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: QuickeR-windows.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" src/main.py

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-android-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: uv run flet build apk --yes --verbose --no-rich-output
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/apk/*.apk

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i '' "s/__VERSION__/$VERSION/g" src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-macos-${{ runner.os }}
      - name: Clean CocoaPods cache
        run: rm -rf ~/Library/Caches/CocoaPods ~/.cocoapods
      - name: Clean previous build
        run: rm -rf build
      - name: Build
        run: uv run flet build macos --yes --no-rich-output
      - name: Remove circular symlinks
        run: find build/macos -type l -lname '*.pod*' -delete
      - name: Check build size
        run: du -sh build/macos/*.app
      - name: Package
        run: |
          cd build/macos
          zip -ry ../../QuickeR-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: QuickeR-macos.zip

  build-appimage:
    name: Build Linux AppImage
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dl

      - name: Cache appimagetool
        id: cache-appimagetool
        uses: actions/cache@v4
        with:
          path: appimagetool
          key: appimagetool-x86_64

      - name: Download appimagetool
        if: steps.cache-appimagetool.outputs.cache-hit != 'true'
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Unpack build
        run: |
          mkdir -p build/linux
          unzip -q dl/QuickeR-linux.zip -d build/linux

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=QuickeR.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/* "$APPDIR/usr/bin/"

          BIN_NAME=$(find "$APPDIR/usr/bin" -maxdepth 1 -type f -executable ! -name "*.so*" | head -n1)
          BIN_NAME=$(basename "$BIN_NAME")

          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$BIN_NAME" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ICON_SRC=$(find "$APPDIR/usr/bin" -iname "*.png" | head -n1 || true)
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" "$APPDIR/quicker.png"
          else
            # appimagetool requires an icon to exist; create a blank fallback
            python3 -c "from PIL import Image; Image.new('RGBA',(256,256),(30,136,229,255)).save('$APPDIR/quicker.png')" || \
              touch "$APPDIR/quicker.png"
          fi

          cat > "$APPDIR/quicker.desktop" <<EOF
          [Desktop Entry]
          Name=QuickeR
          Exec=$BIN_NAME
          Icon=quicker
          Type=Application
          Categories=Utility;
          EOF

      - name: Build AppImage
        run: |
          ./appimagetool QuickeR.AppDir QuickeR-linux.AppImage
          chmod +x QuickeR-linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: QuickeR-linux.AppImage

  build-windows-installer:
    name: Build Windows Installer
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dl

      - name: Unpack build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          Expand-Archive -Path dl\QuickeR-windows.zip -DestinationPath build\windows -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Write Inno Setup script
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=QuickeR
          AppVersion=1.0
          DefaultDirName={autopf}\QuickeR
          DefaultGroupName=QuickeR
          OutputDir=.
          OutputBaseFilename=QuickeR-windows-setup
          Compression=lzma2
          SolidCompression=yes

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\QuickeR"; Filename: "{app}\quicker.exe"
          Name: "{autodesktop}\QuickeR"; Filename: "{app}\quicker.exe"
          "@ | Out-File -FilePath installer.iss -Encoding ASCII

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: QuickeR-windows-setup.exe

  build-macos-dmg:
    name: Build macOS DMG
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dl

      - name: Cache Homebrew (create-dmg)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-create-dmg-${{ runner.os }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Unpack build
        run: |
          mkdir -p build/macos
          unzip -q dl/QuickeR-macos.zip -d build/macos

      - name: Build DMG
        run: |
          APP_PATH=$(find build/macos -maxdepth 2 -name "*.app" | head -n1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found under build/macos"
            find build/macos -maxdepth 3
            exit 1
          fi
          set +e
          create-dmg \
            --volname "QuickeR" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 380 120 \
            "QuickeR-macos.dmg" \
            "$APP_PATH"
          DMG_EXIT=$?
          set -e
          echo "create-dmg exit code: $DMG_EXIT"
          # create-dmg returns non-zero on some benign AppleScript Finder
          # warnings even on success; verify the dmg was actually produced.
          test -f QuickeR-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: QuickeR-macos.dmg

  release:
    name: Publish to Releases
    needs: [build-linux, build-windows, build-android, build-macos, build-appimage, build-windows-installer, build-macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/linux-appimage/QuickeR-linux.AppImage
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/windows-installer/QuickeR-windows-setup.exe
            artifacts/android-build/*.apk
            artifacts/macos-build/QuickeR-macos.zip
            artifacts/macos-dmg/QuickeR-macos.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true