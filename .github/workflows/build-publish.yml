name: Build App (Linux, Android, Windows, macOS, iOS) + Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-linux-${{ runner.os }}
      - name: Build
        run: uv run flet build linux --yes --verbose --no-rich-output
      - name: Package
        run: |
          cd build/linux
          zip -r ../../QuickeR-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: QuickeR-linux.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set UTF-8 codepage
        run: chcp 65001
        shell: cmd
      - name: Set app version from pyproject.toml
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version' | Select-Object -First 1
          $version = ($line.Line -replace 'version\s*=\s*"(.*)"', '$1')
          Write-Host "Detected version: $version"
          (Get-Content src/main.py) -replace '__VERSION__', $version | Set-Content src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\flutter
          key: flutter-windows-${{ runner.os }}
      - name: Build
        run: uv run flet build windows --yes --verbose --no-rich-output
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
      - name: Package
        run: Compress-Archive -Path build/windows/* -DestinationPath QuickeR-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: QuickeR-windows.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" src/main.py

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-android-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: uv run flet build apk --yes --verbose --no-rich-output
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/apk/*.apk

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i '' "s/__VERSION__/$VERSION/g" src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-macos-${{ runner.os }}
      - name: Build
        run: uv run flet build macos --yes --verbose --no-rich-output
      - name: Package
        run: |
          cd build/macos
          zip -r ../../QuickeR-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: QuickeR-macos.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set app version from pyproject.toml
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          echo "Detected version: $VERSION"
          sed -i '' "s/__VERSION__/$VERSION/g" src/main.py
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-ios-${{ runner.os }}
      - name: Build (unsigned)
        run: uv run flet build ipa --yes --verbose --no-rich-output
      - name: Package
        run: |
          cd build/ipa
          zip -r ../../QuickeR-ios.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: QuickeR-ios.zip

  release:
    name: Publish to Releases
    needs: [build-linux, build-windows, build-android, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/android-build/*.apk
            artifacts/macos-build/QuickeR-macos.zip
            artifacts/ios-build/QuickeR-ios.zip
          generate_release_notes: true
          fail_on_unmatched_files: true