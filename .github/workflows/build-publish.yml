name: Build App (Linux, Android, Windows) + Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Build
        run: uv run flet build linux --yes --verbose
      - name: Package
        run: |
          cd build/linux
          zip -r ../../QuickeR-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: QuickeR-linux.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build
        run: uv run flet build windows --yes --verbose
      - name: Package
        run: Compress-Archive -Path build/windows/* -DestinationPath QuickeR-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: QuickeR-windows.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build APK
        run: uv run flet build apk --yes --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/apk/*.apk

  release:
    name: Publish to Releases
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/android-build/*.apk
          generate_release_notes: true