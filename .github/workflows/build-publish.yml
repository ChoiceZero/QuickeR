name: Build App (Linux, Android, Windows) + Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-linux-${{ runner.os }}
      - name: Build
        run: uv run flet build linux --yes --verbose --no-rich-output
      - name: Package
        run: |
          cd build/linux
          zip -r ../../QuickeR-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: QuickeR-linux.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set UTF-8 codepage
        run: chcp 65001
        shell: cmd
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\flutter
          key: flutter-windows-${{ runner.os }}
      - name: Build
        run: uv run flet build windows --yes --verbose --no-rich-output
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
      - name: Package
        run: Compress-Archive -Path build/windows/* -DestinationPath QuickeR-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: QuickeR-windows.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-android-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: uv run flet build apk --yes --verbose --no-rich-output
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/apk/*.apk

  release:
    name: Publish to Releases
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/android-build/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true