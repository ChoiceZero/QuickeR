name: Build & Publish (Preview)

# Manual only. Bumps a 4th version digit (x.y.z.N) without touching x.y.z,
# builds every platform and publishes a GitHub *pre-release* titled "[Beta] ...".
# build-publish.yml ignores the 4th digit, so the next regular release is z+1.

on:
  workflow_dispatch:

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump preview version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump preview version
        id: bump
        run: |
          CURRENT=$(grep -m1 '^version' pyproject.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH PREVIEW <<< "$CURRENT"
          PREVIEW=$(( ${PREVIEW:-0} + 1 ))
          NEW="$MAJOR.$MINOR.$PATCH.$PREVIEW"
          echo "Current version: $CURRENT -> New version: $NEW"
          sed -i "s/^version[[:space:]]*=[[:space:]]*\".*\"/version = \"$NEW\"/" pyproject.toml
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Resolve commit sha to build
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: bump-version
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.bump-version.outputs.sha }}
    secrets: inherit

  release:
    name: Publish pre-release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Generate changelog (PRs merged since previous release or preview)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-version.outputs.version }}
          SHA: ${{ needs.bump-version.outputs.sha }}
        run: |
          # Previous tag of any kind (stable or preview).
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -n1 || true)
          echo "Previous tag: ${PREV:-<none>}"
          ARGS=(-f "tag_name=v$VERSION" -f "target_commitish=$SHA")
          if [ -n "$PREV" ]; then ARGS+=(-f "previous_tag_name=$PREV"); fi
          {
            echo "> **Beta / preview build** - may be unstable."
            echo
            gh api "repos/${{ github.repository }}/releases/generate-notes" "${ARGS[@]}" --jq .body
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.bump-version.outputs.version }}
          target_commitish: ${{ needs.bump-version.outputs.sha }}
          name: "[Beta] QuickeR v${{ needs.bump-version.outputs.version }}"
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            artifacts/linux-build/QuickeR-linux.zip
            artifacts/linux-appimage/QuickeR-linux.AppImage
            artifacts/windows-build/QuickeR-windows.zip
            artifacts/windows-installer/QuickeR-windows-setup.exe
            artifacts/android-build/*.apk
            artifacts/macos-build/QuickeR-macos.zip
            artifacts/macos-dmg/QuickeR-macos.dmg
          fail_on_unmatched_files: true
